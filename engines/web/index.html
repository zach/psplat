<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>psplat viewer</title>
<style>
  :root { color-scheme: dark; --panel: rgba(20, 22, 26, 0.88); --text: #e8eaed; --muted: #9aa0a6; --accent: #8ab4f8; }
  html, body { margin: 0; height: 100%; background: #000; color: var(--text); font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  #canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #panel { position: fixed; top: 12px; left: 12px; width: min(340px, calc(100vw - 24px)); background: var(--panel); border-radius: 8px; padding: 12px 14px; box-sizing: border-box; }
  #panel h1 { font-size: 14px; margin: 0 0 8px; font-weight: 600; }
  .row { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
  .row label { flex: 0 0 auto; color: var(--muted); }
  .row input[type=range] { flex: 1 1 auto; min-width: 0; }
  .row select { flex: 1 1 auto; min-width: 0; }
  #stats { font-variant-numeric: tabular-nums; margin-top: 8px; display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; }
  #stats dt { color: var(--muted); }
  #stats dd { margin: 0; text-align: right; }
  #ticks { display: flex; justify-content: space-between; color: var(--muted); font-size: 11px; margin: -2px 2px 4px; }
  #status { color: var(--muted); margin-top: 6px; min-height: 1.4em; }
  #status.error { color: #f28b82; }
  #divider { position: fixed; top: 0; bottom: 0; left: 50%; width: 2px; background: rgba(255, 255, 255, 0.6); display: none; pointer-events: none; }
  .side-label { position: fixed; top: 12px; padding: 2px 8px; border-radius: 4px; background: var(--panel); display: none; }
  #label-a { left: calc(50% - 12px); transform: translateX(-100%); }
  #label-b { right: 12px; }
  body.split #divider, body.split .side-label { display: block; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="divider"></div>
<div id="label-a" class="side-label">budget</div>
<div id="label-b" class="side-label">full scene</div>
<div id="panel">
  <h1 id="title">psplat viewer</h1>
  <div class="row">
    <label for="budget">Budget</label>
    <input id="budget" type="range" min="0" max="0" step="1" value="0">
  </div>
  <div id="ticks"></div>
  <div class="row">
    <label for="snap">Steps</label>
    <select id="snap">
      <option value="cuts">cut points</option>
      <option value="raw">any splat count</option>
    </select>
  </div>
  <div class="row">
    <label for="split">Compare with full scene</label>
    <input id="split" type="checkbox">
  </div>
  <div class="row">
    <label for="minsigma">Hide splats below</label>
    <input id="minsigma" type="range" min="0" max="4" step="0.25" value="0">
    <span id="minsigma-value">off</span>
  </div>
  <div class="row">
    <label for="view">View</label>
    <select id="view"><option value="">orbit</option></select>
  </div>
  <dl id="stats">
    <dt>Splats</dt><dd id="stat-splats">–</dd>
    <dt>Share</dt><dd id="stat-share">–</dd>
    <dt>Bytes</dt><dd id="stat-bytes">–</dd>
    <dt>Frame</dt><dd id="stat-fps">–</dd>
  </dl>
  <div id="status">loading…</div>
</div>
<script type="module" src="viewer.mjs"></script>
</body>
</html>
